name: CI Checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  code-quality-and-unit-tests:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      # ---------------------------------------------------
      # 1. CHECAGENS DA PASTA E2E (Apenas Lint)
      # ---------------------------------------------------
      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Lint E2E Code
        working-directory: e2e
        run: npm run lint --if-present

      # NOTA: O 'npm test' foi removido daqui propositalmente! 
      # O Playwright agora é responsabilidade exclusiva do workflow e2e.yml.

