name: E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Start containers
        run: docker compose -f docker-compose.e2e.yml up -d --build

      - name: Wait for backend to be ready
        run: |
          echo "Aguardando o backend ficar disponível na porta 3001..."
              timeout 60s bash -c 'until curl -s http://localhost:3001/api/testing/reset > /dev/null; do echo "Aguardando..."; sleep 2; done'
              echo "Backend está pronto!"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies & Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps

      - name: Run Playwright tests
        working-directory: e2e
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/

      - name: Stop containers
        if: always()
        run: docker compose -f docker-compose.e2e.yml down