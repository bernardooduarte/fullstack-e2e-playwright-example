services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: testpass
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testuser -d testdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    dockerfile: Dockerfile.e2e
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      DATABASE_URL: postgresql://testuser:testpass@postgres:5432/testdb
    depends_on:
      postgres:
        condition: service_healthy # Só inicia o backend quando o banco estiver 100% pronto

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:3001
    depends_on:
      - backend